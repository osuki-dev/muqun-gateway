[package]
name = "muqun-gateway"
version = "0.13.0"
edition = "2021"
license = "MIT"
description = "Token-protected mobile gateway for Herdr and tmux terminal workspaces."
repository = "https://github.com/osuki-dev/muqun-gateway"
readme = "README.md"
keywords = ["terminal", "gateway", "tmux", "herdr", "tailscale"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.103"
aes-gcm = "0.11.1"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart", "http2", "ws"] }
# Response compression. Already in the tree through reqwest; named here
# so the compression features are actually on.
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
base64 = "0.23.1"
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
# Just `join_all`, to probe configured backends concurrently in
# `GET /api/sessions` -- tokio has no bundled fan-out-and-collect primitive
# for a dynamic list of futures that doesn't require spawning tasks.
futures = { version = "0.3.32", default-features = false, features = ["std"] }
hkdf = "0.13.0"
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.178"
# Default features pull in the `image` crate -- a full image decoder, and the
# largest attack surface in this dependency tree -- for a renderer this gateway
# never calls. The QR code is rendered to unicode half-blocks by the core crate.
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.11.0"
tokio = { version = "1.53.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "io-util", "sync", "time"] }
tokio-stream = "0.1.18"
# Structured logs for the agent engine: the SSE reader, the event mapper and
# the OpenCode client all run unattended, and `eprintln!` left every failure
# there indistinguishable from an idle stream.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "smallvec", "std", "tracing-log"] }
uuid = { version = "1.24.0", features = ["v4"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# `rustls-tls-webpki-roots`: a linked peer at an `https://` URL is followed
# over `wss://` (`fleet::peer_client::TaskFeed`), with the same rustls and
# webpki roots reqwest already uses.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# `CancellationToken` for the T3 Code RPC connection actor: one token stops
# the socket task, its ping timer and every subscription together. Already in
# the tree through reqwest, so this adds no compiled crate.
tokio-util = "0.7.19"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
hex = "0.4"
# `ServiceExt::oneshot`: `/mcp` drives a per-request rmcp service with it, and
# tests drive a Router. Already in the tree through axum.
tower = { version = "0.5", default-features = false, features = ["util"] }
toml = "0.9"

[profile.release]
# The gateway ships as a single prebuilt binary per platform. Thin LTO and one
# codegen unit trade a slower release build for a smaller, faster artifact;
# stripping drops the symbol tables nothing needs at runtime.
lto = "thin"
codegen-units = 1
strip = true
