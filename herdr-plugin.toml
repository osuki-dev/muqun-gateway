id = "herdr.gateway"
name = "Muqun Gateway (Herdr integration)"
version = "0.5.0"
min_herdr_version = "0.7.5"
description = "Run Muqun's token-protected terminal gateway with Herdr and tmux backends."
platforms = ["linux", "macos"]

# Downloads a prebuilt binary for this OS/arch (no Rust needed), and only
# compiles from source when no matching release binary is published.
[[build]]
command = ["sh", "scripts/fetch-binary.sh"]

[[actions]]
id = "setup"
title = "Setup Gateway"
contexts = ["workspace"]
command = ["./target/release/muqun-gateway", "setup"]

[[actions]]
id = "start"
title = "Start Gateway"
contexts = ["workspace"]
command = ["./target/release/muqun-gateway", "start"]

[[actions]]
id = "stop"
title = "Stop Gateway"
contexts = ["workspace"]
command = ["./target/release/muqun-gateway", "stop"]

[[actions]]
id = "status"
title = "Gateway Status"
contexts = ["workspace"]
command = ["./target/release/muqun-gateway", "status"]

[[panes]]
id = "manage"
title = "Gateway Manager"
placement = "popup"
width = 92
height = 40
command = ["./target/release/muqun-gateway", "manage"]

[[panes]]
id = "foreground"
title = "Gateway Foreground"
placement = "tab"
command = ["./target/release/muqun-gateway", "run"]
