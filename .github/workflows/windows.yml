name: windows

# Native Windows is not a release target yet (see docs/windows.md). This job
# keeps the gateway compiling, linting and testing on Windows so the agent-only
# work can land in small steps, and so a change that only builds on Unix is
# caught before it reaches main rather than when a release is cut.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
