name: ci

# Every push and pull request runs what AGENTS.md asks a contributor to run
# locally: formatting, lints, the locked test suite, and the dependency audit.
# The Herdr and tmux contracts stay behind `--ignored` -- they need a real
# server on an isolated socket -- and are run by hand when an adapter changes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The gateway drives tmux, so a test that looks it up finds it here the
      # same way it does on a developer machine.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The LaunchAgent, launchctl and proc_pidpath paths are
  # `#[cfg(target_os = "macos")]` and compile nowhere else; release.yml builds
  # them only when a tag is pushed. A separate job, so a macOS-only failure is
  # reported on its own and does not hide the Linux checks. Linux-only tests
  # stay behind their own `#[cfg(target_os = "linux")]`.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: brew install tmux

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check publishes a check when it finds an advisory or warning.
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
