name: Verify Desktop macOS signing

on:
  workflow_call:
    secrets:
      DESKTOP_MACOS_CERTIFICATE_P12:
        required: true
      DESKTOP_MACOS_CERTIFICATE_PASSWORD:
        required: true
      DESKTOP_MACOS_SIGN_IDENTITY:
        required: true
      DESKTOP_APPLE_API_KEY_P8:
        required: true
      DESKTOP_APPLE_KEY_ID:
        required: true
      DESKTOP_APPLE_ISSUER_ID:
        required: true

permissions:
  contents: read

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && !contains(github.ref_name, '-preview.'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: muqun-desktop-macOS
          path: candidate
      - name: Sign and notarize the checked candidate
        env:
          CERT: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.DESKTOP_MACOS_SIGN_IDENTITY }}
          API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.DESKTOP_APPLE_KEY_ID }}
          ISSUER: ${{ secrets.DESKTOP_APPLE_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
          # Make the signing identity discoverable to codesign, not only to an
          # explicit find-identity query. Preserve the runner's existing search
          # list and restore it during cleanup (GitHub's Apple signing setup).
          python3 - "$RUNNER_TEMP/signing-keychains.json" <<'PY_SAVE'
          import json, pathlib, shlex, subprocess, sys
          original = shlex.split(subprocess.check_output(
              ["security", "list-keychains", "-d", "user"], text=True
          ))
          pathlib.Path(sys.argv[1]).write_text(json.dumps(original))
          PY_SAVE
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 - "$RUNNER_TEMP/signing-keychains.json" "$keychain" <<'PY_SEARCH'
          import json, pathlib, subprocess, sys
          original = json.loads(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run([
              "security", "list-keychains", "-d", "user", "-s",
              sys.argv[2], *[path for path in original if path != sys.argv[2]],
          ], check=True)
          PY_SEARCH
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          cd candidate
          shasum -a 256 -c *.zip.sha256
          archives=(muqun-desktop-*-macos-arm64.zip)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Muqun Desktop.app"
          python3 - "$keychain" "$app" <<'PY'
          import re, subprocess, sys
          keychain, app = sys.argv[1:]
          listing = subprocess.check_output(
              ["security", "find-identity", "-v", "-p", "codesigning", keychain], text=True
          )
          identities = re.findall(r'([0-9A-Fa-f]{40}) "Developer ID Application: [^"\n]+"', listing)
          if len(identities) != 1:
              raise SystemExit("Expected one valid imported Developer ID Application identity; check private key, expiry and certificate chain")
          print("::add-mask::" + identities[0], flush=True)
          for target in (app + "/Contents/Helpers/muqun-desktop-install", app):
              subprocess.run([
                  "codesign", "--force", "--options", "runtime", "--timestamp",
                  "--keychain", keychain, "--sign", identities[0], target,
              ], check=True)
          PY
          codesign --verify --deep --strict "$app"
          mkdir -p ../signed
          ditto -c -k --keepParent "$app" "../signed/$archive"
          xcrun notarytool submit "../signed/$archive" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "Accepted"' "$RUNNER_TEMP/notary-result.json"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          rm "../signed/$archive"
          ditto -c -k --keepParent "$app" "../signed/$archive"
          cd ../signed
          shasum -a 256 "$archive" > "$archive.sha256"
          bash "$GITHUB_WORKSPACE/desktop/scripts/smoke-signed-installer.sh" "$archive"
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          python3 - "$RUNNER_TEMP/signing-keychains.json" <<'PY_RESTORE'
          import json, pathlib, subprocess, sys
          saved = pathlib.Path(sys.argv[1])
          if saved.exists():
              subprocess.run([
                  "security", "list-keychains", "-d", "user", "-s",
                  *json.loads(saved.read_text()),
              ], check=True)
              saved.unlink()
          PY_RESTORE
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-signed-macos
          path: signed/*
          if-no-files-found: error
