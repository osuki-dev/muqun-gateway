name: Desktop CI

# muqun-desktop consumes Blinc through `[patch.crates-io]` entries in the root
# Cargo.toml that point at a local worktree of our fork. CI cannot see that
# path, so the workflow checks the fork out as a sibling directory
# (`../blinc`) and `desktop/scripts/ci-patch-blinc.sh` rewrites the paths in
# the runner's copy of Cargo.toml (not committed).
#
# The fork is not published yet. Until it is, set the repository variables
# BLINC_REPO (e.g. `owner/blinc`) and BLINC_REV (commit/branch), or pass
# `blinc_repo` / `blinc_rev` to a manual run. With neither, the build jobs are
# skipped (and the workflow stays green) rather than failing on push/PR.
# Once the root manifest uses a git dependency, delete the prepare job, the
# checkout and patch steps.

on:
  push:
    branches: [main]
    paths: ["desktop/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["desktop/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-ci.yml"]
  workflow_dispatch:
    inputs:
      blinc_repo:
        description: "Blinc fork as owner/name (overrides vars.BLINC_REPO)"
        required: false
        default: ""
      blinc_rev:
        description: "Blinc fork commit, tag or branch (overrides vars.BLINC_REV)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Resolve Blinc fork
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.r.outputs.enabled }}
      repo: ${{ steps.r.outputs.repo }}
      rev: ${{ steps.r.outputs.rev }}
    steps:
      - id: r
        env:
          IN_REPO: ${{ inputs.blinc_repo }}
          IN_REV: ${{ inputs.blinc_rev }}
          VAR_REPO: ${{ vars.BLINC_REPO }}
          VAR_REV: ${{ vars.BLINC_REV }}
        run: |
          repo="${IN_REPO:-$VAR_REPO}"
          rev="${IN_REV:-$VAR_REV}"
          if [ -z "$repo" ] || [ -z "$rev" ]; then
            echo "::notice::Blinc fork not configured (BLINC_REPO/BLINC_REV or blinc_repo/blinc_rev); desktop jobs skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "repo=$repo" >> "$GITHUB_OUTPUT"
            echo "rev=$rev" >> "$GITHUB_OUTPUT"
          fi

  lint-platform-cfg:
    name: No cfg(target_os) outside platform/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep
        run: |
          hits="$(grep -rn --include='*.rs' 'cfg(target_os' desktop/src | grep -v '^desktop/src/platform/' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::cfg(target_os) is only allowed under desktop/src/platform/"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: muqun
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ needs.prepare.outputs.rev }}
          path: blinc
          # A private fork needs a token secret; the default token cannot read it.
          token: ${{ secrets.BLINC_TOKEN || github.token }}
      - name: Point Blinc patch paths at the checkout
        working-directory: muqun
        run: desktop/scripts/ci-patch-blinc.sh "$GITHUB_WORKSPACE/blinc"

      # Package list: Blinc's own CI (.github/workflows/ci.yml, "Install Linux
      # dependencies"), which covers winit/wgpu (wayland, xkbcommon, X11,
      # vulkan, GL/EGL), fontconfig, gtk/glib/atk/xdo (rfd dialogs, tray) and
      # alsa (blinc_media). Added: mesa-vulkan-drivers (lavapipe, so wgpu has
      # an adapter in the smoke test) and xvfb/weston/cage for the smoke jobs.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig1-dev fonts-dejavu-core \
            libglib2.0-dev libatk1.0-dev libgtk-3-dev libdbus-1-dev libxdo-dev \
            libasound2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muqun

      - name: fmt
        working-directory: muqun
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: muqun
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        working-directory: muqun
        run: cargo test --workspace --locked
      - name: build release
        working-directory: muqun
        run: cargo build --release -p muqun-desktop

      - name: Collect binary
        run: |
          mkdir out
          cp muqun/target/release/muqun-desktop* out/ 2>/dev/null || true
          rm -f out/*.d out/*.pdb
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: muqun-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  # Smoke: start the release binary, wait 5 s, SIGTERM it. A first frame is
  # logged as `build_ui` at debug level (see desktop/src/main.rs), so the run
  # enables that target. The app installs no SIGTERM handler, so the process
  # dies by the signal (143); success is judged by the log, not the exit code.
  smoke-x11:
    name: Smoke (Linux, X11/xvfb)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muqun-desktop-Linux
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libgtk-3-0 libasound2t64 fonts-dejavu-core
      - name: Run 5 s
        run: |
          chmod +x muqun-desktop
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          set +e
          RUST_LOG=info,muqun_desktop=debug WINIT_UNIX_BACKEND=x11 \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            timeout -s TERM 5 ./muqun-desktop > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          echo "exit code: $code (124 = still running at SIGTERM, 143 = killed by it)"
          grep -q "muqun-desktop starting" smoke.log
          grep -q "build_ui" smoke.log || { echo "::error::no first frame logged"; exit 1; }
          ! grep -qi "panicked" smoke.log
          case "$code" in 0|124|143) ;; *) echo "::error::unexpected exit $code"; exit 1;; esac

  smoke-wayland:
    name: Smoke (Linux, Wayland/weston)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Headless weston + lavapipe on hosted runners is unproven for wgpu's
    # Wayland path; informational until it has been seen passing.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muqun-desktop-Linux
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y weston mesa-vulkan-drivers libvulkan1 libwayland-client0 libxkbcommon0 libgtk-3-0 libasound2t64 fonts-dejavu-core
      - name: Run 5 s
        run: |
          chmod +x muqun-desktop
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" && mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-ci --width=1280 --height=800 > weston.log 2>&1 &
          wpid=$!
          for _ in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break; sleep 0.5; done
          set +e
          RUST_LOG=info,muqun_desktop=debug WAYLAND_DISPLAY=wl-ci WINIT_UNIX_BACKEND=wayland \
            env -u DISPLAY timeout -s TERM 5 ./muqun-desktop > smoke.log 2>&1
          code=$?
          set -e
          kill "$wpid" || true
          cat smoke.log
          echo "exit code: $code"
          grep -q "build_ui" smoke.log || { echo "::error::no first frame logged"; exit 1; }
          ! grep -qi "panicked" smoke.log
