name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: stable-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed stable version and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "release-notes/$RELEASE_TAG.md"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          manifest = Path('Cargo.toml').read_text()
          assert re.search(r'^version = "' + re.escape(version) + r'"$', manifest, re.M)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        if: matrix.builder == 'cargo'
        run: rustup target add ${{ matrix.target }}
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        run: ${{ matrix.builder }} build --release --locked --target ${{ matrix.target }}
      - name: Stage build artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="muqun-gateway-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/muqun-gateway" "$binary"
          shasum -a 256 "$binary" > "$binary.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            muqun-gateway-${{ matrix.target }}
            muqun-gateway-${{ matrix.target }}.sha256
          if-no-files-found: error

  sign:
    needs: [prepare, build]
    uses: osuki-dev/muqun-gateway/.github/workflows/sign-macos.yml@main
    with:
      artifact-prefix: release
      source-sha: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-unknown-linux-musl
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-signed-macos
          path: artifacts
      - name: Validate complete signed matrix before publication
        run: |
          set -euo pipefail
          cd artifacts
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "muqun-gateway-$target"
            test -s "muqun-gateway-$target.sha256"
            sha256sum --check "muqun-gateway-$target.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
      - name: Publish once without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false --latest=true
