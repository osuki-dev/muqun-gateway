[package]
name = "muqun-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Muqun Desktop: a native client for the coding agents on this computer."
repository = "https://github.com/osuki-dev/muqun-gateway"
publish = false

[[bin]]
name = "muqun-desktop"
path = "src/main.rs"

# UI: anomalyco/rune, pinned to a reviewed commit.
[dependencies]
muqun-gateway = { path = ".." }
rune = { git = "https://github.com/anomalyco/rune", rev = "ccb4823f55749dfa667891ef7f8427017e960056" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ccb4823f55749dfa667891ef7f8427017e960056", features = ["markdown"] }
anyhow = "1.0.103"
base64 = "0.23.1"
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs"] }
# Remote hub (`hub/remote.rs`): HTTP / WebSocket clients.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
# Pasting an image into the composer (`platform/clipboard.rs`).
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Without this feature arboard talks X11 only and loses copies on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
