[package]
name = "muqun-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Muqun Desktop: a native client for the coding agents on this computer."
repository = "https://github.com/osuki-dev/muqun-gateway"
publish = false

[[bin]]
name = "muqun-desktop"
path = "src/main.rs"

# Blinc: the `=0.5.1` crates.io requirement, patched in the workspace root to
# the muqun fork at a fixed commit (IME pre-edit fix). See the root
# `Cargo.toml` `[patch.crates-io]` for why it is a git revision.
[dependencies]
muqun-gateway = { path = ".." }
blinc_app = { version = "=0.5.1", features = ["windowed", "dialogs"] }
blinc_layout = { version = "=0.5.1" }
blinc_core = { version = "=0.5.1" }
blinc_theme = { version = "=0.5.1", features = ["watcher"] }
blinc_cn = { version = "=0.5.1" }
blinc_animation = { version = "=0.5.1" }
# WebP for theme covers drawn by `image()`; the decoder is already in the tree.
blinc_image = { version = "=0.5.1", features = ["webp"] }
anyhow = "1.0.103"
base64 = "0.23.1"
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs"] }
# Theme packages (`theme/pack.rs`): a bounded ZIP reader over raw DEFLATE and
# CRC-32, the same two crates the tree already builds for resvg.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5.3"
# Theme gallery (`theme/gallery.rs`): the gateway's own HTTP client, digests
# and image codecs -- no crate here is new to the workspace.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
# Message markdown: the same parser (and version) Blinc's own renderer uses.
pulldown-cmark = { version = "0.10", default-features = false }
# Code-fence highlighting through Blinc's `SyntaxHighlighter` trait: pure
# Rust regexes, the bundled Sublime grammars, no bundled themes (colours
# come from the app theme).
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Not used directly: Blinc's `clipboard_write` goes through arboard, which
# without this feature talks X11 only and loses copies on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
