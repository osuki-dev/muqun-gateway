[package]
name = "muqun-wry-embedded"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Offscreen WebView surface for Muqun Desktop (Linux WebKitGTK and macOS WKWebView)"

[dependencies]
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3"
futures-util = "0.3"
gtk = "0.18"
webkit2gtk = "2.0"
wry = "0.55"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[workspace]
